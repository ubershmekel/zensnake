# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

# The Godot binary is not on PATH on most machines. Override per-machine with
# either an env var or on the command line:
#   export GODOT="E:/dev/Godot/Godot_v4.5.1-stable_win64_console.exe"
#   task build-android GODOT="E:/dev/Godot/Godot_v4.5.1-stable_win64_console.exe"
vars:
  GODOT: '{{.GODOT | default (env "GODOT") | default "godot"}}'
  PYTHON: '{{.PYTHON | default (env "PYTHON") | default "python"}}'
  # Template version directory under the Godot editor's export_templates.
  GODOT_VERSION: "4.5.1.stable"
  # Play only enforces targetSdk. compileSdk stays a step behind because
  # compiling against 37 needs AGP 9.x and Godot still ships AGP 8.6.1.
  TARGET_SDK: "37"
  COMPILE_SDK: "36"
  BUILD_TOOLS: "36.1.0"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  run:
    desc: Run the game
    cmds:
      - '"{{.GODOT}}" --path .'

  edit:
    desc: Open the project in the Godot editor
    cmds:
      - '"{{.GODOT}}" --path . -e'

  android-template:
    desc: >-
      Reinstall Godot's Android build template into android/build, then
      re-apply the SDK bump. Wipes android/build, so any local edits are lost.
    cmds:
      - '"{{.PYTHON}}" tools/android_release.py install-template
        --godot-version {{.GODOT_VERSION}}'
      - task: android-patch-template

  android-patch-template:
    desc: >-
      Bump compileSdk/buildTools in android/build/config.gradle. android/ is
      gitignored and regenerated by android-template, so this must run again
      after every template reinstall.
    cmds:
      - '"{{.PYTHON}}" tools/android_release.py patch-template
        --compile-sdk {{.COMPILE_SDK}} --target-sdk {{.TARGET_SDK}}
        --build-tools {{.BUILD_TOOLS}}'

  build-android:
    desc: Export the signed release .aab to exports/ (targets Android SDK 37)
    cmds:
      - task: android-patch-template
      - '"{{.GODOT}}" --headless --path . --export-release "Android"'
      - task: android-verify

  android-verify:
    desc: Assert the .aab that was just built really targets Android SDK 37
    cmds:
      - '"{{.PYTHON}}" tools/android_release.py verify --target-sdk {{.TARGET_SDK}}'

  bump-version:
    desc: >-
      Bump config/version in project.godot (drives both the Android
      versionName and the iOS version) and the Android version/code.
    cmds:
      - '"{{.PYTHON}}" tools/bump_version.py {{.CLI_ARGS}}'

  build-web:
    desc: Export the web build to export/
    cmds:
      - '"{{.GODOT}}" --headless --path . --export-release "Web"'

  build-ios:
    desc: >-
      Export exports/zensnake.xcodeproj, then archive it in Xcode. Xcode Cloud
      runs its own export via exports/ci_scripts/ci_post_clone.sh.
    cmds:
      - '"{{.GODOT}}" --headless --path . --export-release "iOS"'

  open-exports:
    desc: Open the exports folder in Windows Explorer to upload the .aab
    cmds:
      - explorer exports || true

  clean:
    desc: Remove build outputs and Godot's gradle build directory
    cmds:
      - '"{{.PYTHON}}" -c "import shutil; [shutil.rmtree(p, ignore_errors=True) for p in (''exports'', ''export'', ''android/build/build'')]"'
